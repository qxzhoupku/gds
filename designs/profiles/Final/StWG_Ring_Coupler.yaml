# designs/profiles/coupler_01.yaml
extends: designs/base.yaml

chip:
  out: out/coupler_01_no_WG.gds

defaults:
  grid_um: 0.0001

instances:
  Arc1:
    type: ARC
    params: { angle_deg: 30, radius: 100.0, width: 1.8 }

  # ST_WG:
  #   type: TAPER
  #   params: { w0: 1.0, w1: 1.0, L: 120.0 }
  
  Arc2:
    type: ARC
    params: { angle_deg: 15, radius: 100.0, width: 1.8 }
  
  ST_WG_2:
    type: TAPER
    params: { w0: 1.8, w1: 1.8, L: 8.0 }

placement:
  - place: { inst: Arc1, at: [0, 100], as: Arc1_1, rot: -105 }
  # - place: { inst: ST_WG, at: [-60, -1.9], as: ST_WG_1 }
  - connect: { inst: Arc2, port: E, to: Arc1_1.E, as: Arc2_1 }
  - connect: { inst: Arc2, port: W, to: Arc1_1.W, as: Arc2_2 }
  - connect: { inst: ST_WG_2, port: E, to: Arc2_2.E, as: ST_WG_2_1 }
  - connect: { inst: ST_WG_2, port: E, to: Arc2_1.W, as: ST_WG_2_2 }

routes:

