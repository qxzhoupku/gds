# =============================================================================
# 4x4 Coupled Racetrack Resonator Lattice — 7 IDENTICAL COPIES
# =============================================================================
# 7 copies vertically with 848.9 µm pitch
# Copy centers (y): [-240.0, 608.9, 1457.8, 2306.7, 3155.6, 4004.5, 4853.4]
# Y offsets: [-2240.0, -1391.1, -542.2, 306.7, 1155.6, 2004.5, 2853.4]
# Prefixes: ['D1', 'D2', 'D3', 'D4', 'D5', 'D6', 'D7']
# =============================================================================

# =============================================================================
# 4x4 Coupled Racetrack Resonator Lattice with L-couplers and WX Crossings
# =============================================================================
# Racetrack: R=30.0µm, L_straight=400.0µm, w=1.8µm, pitch=100.0µm
# Bus: w=1.0µm, L-shaped (left→down→right), point contact coupling
# L-coupler: w=1.8µm, R=30.0µm bend, 30µm arms, gap=0.5µm
# WX crossings at all 64 H×V straight intersection points
# Edge taper: 0.15→1.0µm, L=400.0µm
# Lattice center: (2000.0, 2000.0)
# =============================================================================

extends: designs/base.yaml

chip:
  out: out/chip_RT_lattice_4x4.gds
  die: { size_um: [6000, 6000], margin_um: 0, at: [-1000, -600] }


instances:

  # --- Racetrack 180° arcs ---
  RT_Semi:
    type: ARC
    params: { radius: 30.0, width: 1.8, angle_deg: 180.0 }

  # --- WX crossing for 1.8µm waveguides ---
  WX_1800:
    type: WX
    params: { WM: 3.6, LM: 28.2, LT: 3.1, w_in: 1.8 }

  # --- L-coupler components ---
  L_Turn:
    type: ARC
    params: { radius: 25.0, width: 1.8, angle_deg: 90.0 }

  L_Arm:
    type: TAPER
    params: { w0: 1.8, w1: 1.8, L: 5.0 }

  L_Arm_02:
    type: TAPER
    params: { w0: 1.8, w1: 1.8, L: 10.0 }

  L_Arm_03:
    type: TAPER
    params: { w0: 1.8, w1: 1.8, L: 15.0 }

  L_Arm_04:
    type: TAPER
    params: { w0: 1.8, w1: 1.8, L: 0.0 }

  # --- Bus waveguide corners ---
  Bus_Corner:
    type: ARC
    params: { radius: 40.0, width: 1.0, angle_deg: 90.0 }

  # --- Drop port corners ---
  Drop_Corner:
    type: ARC
    params: { radius: 30.0, width: 1.0, angle_deg: 120.0 }
  
  Drop_Turn:
    type: ARC
    params: { radius: 30.0, width: 1.0, angle_deg: 90.0 }

  # --- Edge coupler taper ---
  T_E:
    type: TAPER
    params: { w0: 0.15, w1: 1.0, L: 400.0 }


macros:

  # ─── L-coupler: L-shaped evanescent coupler ───
  # H_Arm couples to H bottom straight from inside (above)
  # V_Arm couples to V right straight from inside (left)
  # Bend connects H_Arm to V_Arm via 90° arc
  - name: L_COUPLER_01
    placement:
      - place: { inst: L_Arm, at: [-25, -25], rot: 180, as: H_Arm }
      - place: { inst: L_Turn, at: [-25, 0], rot: -90, as: Bend }
      - place: { inst: L_Arm, at: [0, 0], rot: 90, as: V_Arm }

  - name: L_COUPLER_02
    placement:
      - place: { inst: L_Arm_02, at: [-25, -25], rot: 180, as: H_Arm }
      - place: { inst: L_Turn, at: [-25, 0], rot: -90, as: Bend }
      - place: { inst: L_Arm_02, at: [0, 0], rot: 90, as: V_Arm }

  - name: L_COUPLER_03
    placement:
      - place: { inst: L_Arm_03, at: [-25, -25], rot: 180, as: H_Arm }
      - place: { inst: L_Turn, at: [-25, 0], rot: -90, as: Bend }
      - place: { inst: L_Arm_03, at: [0, 0], rot: 90, as: V_Arm }

  - name: L_COUPLER_04
    placement:
      - place: { inst: L_Arm_04, at: [-25, -25], rot: 180, as: H_Arm }
      - place: { inst: L_Turn, at: [-25, 0], rot: -90, as: Bend }
      - place: { inst: L_Arm_04, at: [0, 0], rot: 90, as: V_Arm }


